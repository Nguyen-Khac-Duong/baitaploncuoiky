<aside class="sidebar" [class.collapsed]="thuGon">
  <div class="brand">
    <span nz-icon nzType="shop" nzTheme="outline" class="brand-icon"></span>
    @if (!thuGon) {
      <div class="brand-text">
        <span class="brand-name">ShopTech</span>
        <span class="brand-tag">Enterprise Admin</span>
      </div>
    }
  </div>

  <ul nz-menu nzMode="inline" [nzInlineCollapsed]="thuGon" class="ant-admin-menu">
    @for (item of menuItems; track item.route) {
      <li 
        nz-menu-item 
        [routerLink]="item.route"
        routerLinkActive="ant-menu-item-selected"
        nz-tooltip
        [nzTooltipTitle]="thuGon ? item.label : null"
        nzTooltipPlacement="right"
      >
        <span nz-icon [nzType]="item.icon" nzTheme="outline"></span>
        <span>{{ item.label }}</span>
      </li>
    }
  </ul>

  <div class="sidebar-footer">
    <button type="button" class="btn-sidebar-logout" (click)="dangXuat()" [title]="thuGon ? 'Đăng Xuất' : ''">
      <span nz-icon nzType="logout" nzTheme="outline" class="logout-icon"></span>
      @if (!thuGon) {
        <span class="nav-text">Đăng Xuất</span>
      }
    </button>
    @if (!thuGon) {
      <div class="version-tag">ShopTech Portal v2.0</div>
    }
  </div>
</aside>
